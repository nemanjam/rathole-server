version: '3.8'

services:
  traefik:
    image: traefik:v2.9.8
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.traefik.address=:8080
      - --api.dashboard=true
      - --api.insecure=false
      - --log.level=DEBUG
      - --accesslog=true
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy
    labels:
      # Enable the dashboard at http://traefik.amd2.nemanjamitic.com
      # http for simplicity, no acme.json file
      - traefik.enable=true
      - 'traefik.http.routers.traefik.rule=Host(`traefik.amd2.${SITE_HOSTNAME}`)'
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.routers.traefik.middlewares=auth
      - 'traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}'

  rathole:
    image: rapiz1/rathole:v0.5.0
    container_name: rathole
    command: --server /config/rathole.server.toml
    restart: unless-stopped
    ports:
      - 2333:2333
    volumes:
      - ./rathole.server.toml:/config/rathole.server.toml:ro
    networks:
      - proxy

    labels:
      ### HTTP port 80 - HTTP routers ###

      # mpc.nemanjamitic.com, www.mpc.nemanjamitic.com, *.mpc.nemanjamitic.com, www.*.mpc.nemanjamitic.com

      # Route *.mpc.nemanjamitic.com -> 5080
      - 'traefik.http.routers.rathole-mpc.rule=HostRegexp(`mpc.${SITE_HOSTNAME}`, `www.mpc.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME}`)'
      - traefik.http.routers.rathole-mpc.entrypoints=web
      - traefik.http.routers.rathole-mpc.service=rathole-mpc
      - traefik.http.services.rathole-mpc.loadbalancer.server.port=5080
      
      # Route *.opi.nemanjamitic.com -> 5081
      - 'traefik.http.routers.rathole-opi.rule=HostRegexp(`opi.${SITE_HOSTNAME}`, `www.opi.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME}`)'
      - traefik.http.routers.rathole-opi.entrypoints=web
      - traefik.http.routers.rathole-opi.service=rathole-opi
      - traefik.http.services.rathole-opi.loadbalancer.server.port=5081

      # Route *.rpi.nemanjamitic.com -> 5082
      - 'traefik.http.routers.rathole-rpi.rule=HostRegexp(`rpi.${SITE_HOSTNAME}`, `www.rpi.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME}`)'
      - traefik.http.routers.rathole-rpi.entrypoints=web
      - traefik.http.routers.rathole-rpi.service=rathole-rpi
      - traefik.http.services.rathole-rpi.loadbalancer.server.port=5082

      ### HTTPS port 443 with TLS passthrough - TCP routers ###

      # Route *.mpc.nemanjamitic.com -> 5443
      - 'traefik.tcp.routers.rathole-mpc-secure.rule=HostSNIRegexp(`mpc.${SITE_HOSTNAME}`, `www.mpc.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME}`)'
      - traefik.tcp.routers.rathole-mpc-secure.entrypoints=websecure
      - traefik.tcp.routers.rathole-mpc-secure.tls.passthrough=true
      - traefik.tcp.routers.rathole-mpc-secure.service=rathole-mpc-secure
      - traefik.tcp.services.rathole-mpc-secure.loadbalancer.server.port=5443

      # Route *.opi.nemanjamitic.com -> 5444
      - 'traefik.tcp.routers.rathole-opi-secure.rule=HostSNIRegexp(`opi.${SITE_HOSTNAME}`, `www.opi.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME}`)'
      - traefik.tcp.routers.rathole-opi-secure.entrypoints=websecure
      - traefik.tcp.routers.rathole-opi-secure.tls.passthrough=true
      - traefik.tcp.routers.rathole-opi-secure.service=rathole-opi-secure
      - traefik.tcp.services.rathole-opi-secure.loadbalancer.server.port=5444

      # Route *.rpi.nemanjamitic.com -> 5445
      - 'traefik.tcp.routers.rathole-rpi-secure.rule=HostSNIRegexp(`rpi.${SITE_HOSTNAME}`, `www.rpi.${SITE_HOSTNAME}`, `{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME}`, `www.{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME}`)'
      - traefik.tcp.routers.rathole-rpi-secure.entrypoints=websecure
      - traefik.tcp.routers.rathole-rpi-secure.tls.passthrough=true
      - traefik.tcp.routers.rathole-rpi-secure.service=rathole-rpi-secure
      - traefik.tcp.services.rathole-rpi-secure.loadbalancer.server.port=5445

      # ------------------------------------------------------------------

      # mpc.varalicar.rs, www.mpc.varalicar.rs, *.mpc.varalicar.rs, www.*.mpc.varalicar.rs

      # Route *.mpc.varalicar.rs -> 5080
      - 'traefik.http.routers.rathole-mpc-2.rule=HostRegexp(`mpc.${SITE_HOSTNAME_2}`, `www.mpc.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME_2}`)'
      - traefik.http.routers.rathole-mpc-2.entrypoints=web
      - traefik.http.routers.rathole-mpc-2.service=rathole-mpc-2
      - traefik.http.services.rathole-mpc-2.loadbalancer.server.port=5080
      
      # Route *.opi.varalicar.rs -> 5081
      - 'traefik.http.routers.rathole-opi-2.rule=HostRegexp(`opi.${SITE_HOSTNAME_2}`, `www.opi.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME_2}`)'
      - traefik.http.routers.rathole-opi-2.entrypoints=web
      - traefik.http.routers.rathole-opi-2.service=rathole-opi-2
      - traefik.http.services.rathole-opi-2.loadbalancer.server.port=5081

      # Route *.rpi.varalicar.rs -> 5082
      - 'traefik.http.routers.rathole-rpi-2.rule=HostRegexp(`rpi.${SITE_HOSTNAME_2}`, `www.rpi.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME_2}`)'
      - traefik.http.routers.rathole-rpi-2.entrypoints=web
      - traefik.http.routers.rathole-rpi-2.service=rathole-rpi-2
      - traefik.http.services.rathole-rpi-2.loadbalancer.server.port=5082

      ### HTTPS port 443 with TLS passthrough - TCP routers ###

      # Route *.mpc.varalicar.rs -> 5443
      - 'traefik.tcp.routers.rathole-mpc-secure-2.rule=HostSNIRegexp(`mpc.${SITE_HOSTNAME_2}`, `www.mpc.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.mpc.${SITE_HOSTNAME_2}`)'
      - traefik.tcp.routers.rathole-mpc-secure-2.entrypoints=websecure
      - traefik.tcp.routers.rathole-mpc-secure-2.tls.passthrough=true
      - traefik.tcp.routers.rathole-mpc-secure-2.service=rathole-mpc-secure-2
      - traefik.tcp.services.rathole-mpc-secure-2.loadbalancer.server.port=5443

      # Route *.opi.varalicar.rs -> 5444
      - 'traefik.tcp.routers.rathole-opi-secure-2.rule=HostSNIRegexp(`opi.${SITE_HOSTNAME_2}`, `www.opi.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.opi.${SITE_HOSTNAME_2}`)'
      - traefik.tcp.routers.rathole-opi-secure-2.entrypoints=websecure
      - traefik.tcp.routers.rathole-opi-secure-2.tls.passthrough=true
      - traefik.tcp.routers.rathole-opi-secure-2.service=rathole-opi-secure-2
      - traefik.tcp.services.rathole-opi-secure-2.loadbalancer.server.port=5444

      # Route *.rpi.varalicar.rs -> 5445
      - 'traefik.tcp.routers.rathole-rpi-secure-2.rule=HostSNIRegexp(`rpi.${SITE_HOSTNAME_2}`, `www.rpi.${SITE_HOSTNAME_2}`, `{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME_2}`, `www.{subdomain:[a-z0-9-]+}.rpi.${SITE_HOSTNAME_2}`)'
      - traefik.tcp.routers.rathole-rpi-secure-2.entrypoints=websecure
      - traefik.tcp.routers.rathole-rpi-secure-2.tls.passthrough=true
      - traefik.tcp.routers.rathole-rpi-secure-2.service=rathole-rpi-secure-2
      - traefik.tcp.services.rathole-rpi-secure-2.loadbalancer.server.port=5445

networks:
  proxy:
    external: true
